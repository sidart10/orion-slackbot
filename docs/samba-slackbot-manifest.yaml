display_information:
  name: Samba
  description: ai assistant
  background_color: "#000000"
  long_description: Samba is your AI assistant for Samba Employees. Ask questions, research topics, summarize threads, and more. It can do a ton of other things. We will be unlocking them soon. Thank you for being so patient.
features:
  assistant_view:
    assistant_description: Samba is your AI assistant for Samba Employees. Ask questions, research topics, summarize threads, and more.
    suggested_prompts:
      - title: Summarize channel
        message: Can you summarize what's been discussed recently?
      - title: Help me write
        message: Help me draft a message about
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: samba
    always_online: true
  rich_previews:
    is_active: true
    entity_types:
      - slack#/entities/content_item
      - slack#/entities/item
oauth_config:
  scopes:
    user:
      - canvases:read
      - canvases:write
      - channels:history
      - channels:write
      - channels:write.topic
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:read
      - mpim:read
      - reactions:read
      - users:write
      - bookmarks:read
      - bookmarks:write
      - users.profile:write
      - im:write
      - im:history
      - search:read.im
      - remote_files:share
      - remote_files:read
      - search:read
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - canvases:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - channels:write.topic
      - chat:write
      - chat:write.customize
      - chat:write.public
      - commands
      - emoji:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - groups:write.invites
      - groups:write.topic
      - im:history
      - im:read
      - im:write
      - links.embed:write
      - links:read
      - links:write
      - lists:read
      - lists:write
      - metadata.message:read
      - mpim:history
      - mpim:read
      - mpim:write
      - mpim:write.topic
      - pins:read
      - pins:write
      - reactions:write
      - reminders:read
      - remote_files:read
      - remote_files:share
      - remote_files:write
      - usergroups:read
      - usergroups:write
