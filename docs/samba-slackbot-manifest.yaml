      - reactions:read
settings:
  event_subscriptions:
    request_url: https://orion-slack-agent-201626763325.us-central1.run.app/slack/events
    bot_events:
      - app_mention
      - assistant_thread_context_changed
      - assistant_thread_started
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
