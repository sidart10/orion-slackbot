# SandboxTemplate with Orion Skills
# Skills are baked into the container image at /skills/
# @see Story 6.2 Task 9 - Sync Skills to Sandbox Filesystem
# @see https://agentskills.io - Agent Skills open standard
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: python-runtime-template
  namespace: default
spec:
  podTemplate:
    metadata:
      labels:
        sandbox: orion-python-sandbox
    spec:
      runtimeClassName: gvisor
      containers:
        - name: python-runtime
          # Custom image with Orion skills at /skills/
          # Build: docker build -f infra/gke-sandbox/Dockerfile.skills -t gcr.io/ai-workflows-459123/orion-sandbox:skills-v1 .
          image: gcr.io/ai-workflows-459123/orion-sandbox:skills-v1
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: "/"
              port: 8888
            initialDelaySeconds: 0
            periodSeconds: 1
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
      restartPolicy: "OnFailure"
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: orion-sandbox-warmpool
  namespace: default
spec:
  replicas: 1  # Reduced from 2 (2026-01-07) - fallback-only usage
  sandboxTemplateRef:
    name: python-runtime-template

