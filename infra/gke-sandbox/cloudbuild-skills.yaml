# Cloud Build config for Orion Sandbox with Skills
#
# Builds custom sandbox image with .skills/ baked in.
# Trigger manually or via CI when skills change.
#
# Run: gcloud builds submit --config=infra/gke-sandbox/cloudbuild-skills.yaml .
#
# @see Story 6.2 Task 9 - Sync Skills to Sandbox Filesystem

steps:
  # Build the custom sandbox image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'infra/gke-sandbox/Dockerfile.skills'
      - '-t'
      - 'gcr.io/$PROJECT_ID/orion-sandbox:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/orion-sandbox:latest'
      - '.'

  # Push to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/orion-sandbox:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/orion-sandbox:latest']

  # Update SandboxTemplate (optional - can also be done manually)
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'sandboxtemplate/python-runtime-template'
      - 'python-runtime=gcr.io/$PROJECT_ID/orion-sandbox:$SHORT_SHA'
      - '-n'
      - 'default'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=orion-sandbox-cluster'

images:
  - 'gcr.io/$PROJECT_ID/orion-sandbox:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/orion-sandbox:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'
