# Cloud Build configuration for MCP Imagen Server
# Deploy: gcloud builds submit --config=infra/mcp-genmedia/cloudbuild-imagen.yaml

timeout: '900s' # 15 minutes (Go build can be slow)

substitutions:
  _TAG: 'latest'  # Override with --substitutions=_TAG=v1.0.0

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'infra/mcp-genmedia/Dockerfile.imagen'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/orion/mcp-imagen:${_TAG}'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/orion/mcp-imagen:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/orion/mcp-imagen'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mcp-imagen'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/orion/mcp-imagen:${_TAG}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'PROJECT_ID=$PROJECT_ID,LOCATION=us-central1,GENMEDIA_BUCKET=orion-genmedia,DEFAULT_MODEL=imagen-4.0-generate-001'

  # Grant Orion service account invoker access
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'mcp-imagen'
      - '--region'
      - 'us-central1'
      - '--member'
      - 'serviceAccount:201626763325-compute@developer.gserviceaccount.com'
      - '--role'
      - 'roles/run.invoker'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/orion/mcp-imagen:${_TAG}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/orion/mcp-imagen:latest'

