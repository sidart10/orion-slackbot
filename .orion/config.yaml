# Orion Agent Configuration
# @see Epic 2+3

# Default Anthropic model (used if ANTHROPIC_MODEL env var is not set)
model:
  default: "claude-sonnet-4-20250514"

# MCP Server Configuration
# Loaded by src/tools/mcp/config.ts
# @see Epic 3: Tool Connectivity (MCP)

mcp_servers:
  # ─────────────────────────────────────────────────────────────────────────────
  # Internal MCP Servers (Samba)
  # ─────────────────────────────────────────────────────────────────────────────
  
  audience-manager:
    type: http
    enabled: true
    description: "Samba Audience Manager - audience segmentation and targeting"
    url: "https://audience-manager-mcp-vjlizxe2vq-uc.a.run.app/mcp"
    headers: {}

  msci-reports:
    type: http
    enabled: true
    description: "Samba MSCI Reports - report generation and analytics"
    url: "https://report-generator-mcp-vjlizxe2vq-uc.a.run.app/mcp"
    headers: {}

  # ─────────────────────────────────────────────────────────────────────────────
  # External MCP Servers
  # ─────────────────────────────────────────────────────────────────────────────

  exa:
    type: http
    enabled: true
    description: "Exa Search - web search and code context"
    # Default tools: web_search_exa, get_code_context_exa
    # Add ?tools=... to URL to enable more tools
    url: "https://mcp.exa.ai/mcp"
    headers: {}

  rube:
    type: http
    enabled: true
    description: "Rube by Composio - 500+ app integrations (Slack, GitHub, Notion, Google, etc.)"
    url: "https://rube.app/mcp"
    headers:
      Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiJ1c2VyXzAxS0RWRVFONkoyQkFQTU5IODM5V1BGNENQIiwib3JnSWQiOiJvcmdfMDFLRFZFUVFKVDAwUlhWWjFGTVM4WlBIWEMiLCJpYXQiOjE3Njc0MTM0NzB9.CnOGZgq5Hl2u4le4jV2i1HABjqi6c7-Qkn3CKsLocEc"

  # ─────────────────────────────────────────────────────────────────────────────
  # Generative Media MCP Servers (Google Vertex AI)
  # ─────────────────────────────────────────────────────────────────────────────

  genmedia-imagen:
    type: http
    enabled: true
    description: "Google Imagen - image generation via Vertex AI (Imagen 3/4/4 Ultra)"
    url: "https://mcp-imagen-201626763325.us-central1.run.app/mcp"
    headers: {}
    # Cloud Run requires IAM auth - fetch identity token at runtime
    authType: gcp_identity
    # Preferred defaults (pass to tool calls when not specified by user)
    defaults:
      model: "imagen-4.0-generate-001"  # Imagen 4 - best quality
      gcs_bucket_uri: "gs://orion-genmedia/imagen_outputs/"

  genmedia-veo:
    type: http
    enabled: true
    description: "Google Veo - video generation via Vertex AI (Veo 2/3/3.1)"
    url: "https://mcp-veo-201626763325.us-central1.run.app/mcp"
    headers: {}
    # Cloud Run requires IAM auth - fetch identity token at runtime
    authType: gcp_identity
    # Preferred defaults (pass to tool calls when not specified by user)
    defaults:
      model: "veo-3.1-generate-preview"  # Veo 3.1 - best quality with audio
      generate_audio: false
      gcs_bucket_uri: "gs://orion-genmedia/veo_outputs/"
