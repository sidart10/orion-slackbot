# Orion Agent Configuration
# @see Epic 2+3

# Default Anthropic model (used if ANTHROPIC_MODEL env var is not set)
model:
  default: "claude-sonnet-4-20250514"

# MCP Server Configuration
# Loaded by src/tools/mcp/config.ts
# @see Epic 3: Tool Connectivity (MCP)

mcp_servers:
  # ─────────────────────────────────────────────────────────────────────────────
  # Internal MCP Servers (Samba)
  # ─────────────────────────────────────────────────────────────────────────────
  
  audience-manager:
    type: http
    enabled: true
    description: "Samba Audience Manager - audience segmentation and targeting"
    url: "https://audience-manager-mcp-vjlizxe2vq-uc.a.run.app/mcp"
    headers: {}

  msci-reports:
    type: http
    enabled: true
    description: "Samba MSCI Reports - report generation and analytics"
    url: "https://report-generator-mcp-vjlizxe2vq-uc.a.run.app/mcp"
    headers: {}

  # ─────────────────────────────────────────────────────────────────────────────
  # External MCP Servers
  # ─────────────────────────────────────────────────────────────────────────────

  exa:
    type: http
    enabled: true
    description: "Exa Search - web search and code context"
    # Default tools: web_search_exa, get_code_context_exa
    # Add ?tools=... to URL to enable more tools
    url: "https://mcp.exa.ai/mcp"
    headers: {}
